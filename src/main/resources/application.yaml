springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha
    tryItOutEnabled: true
    displayOperationId: true
  show-actuator: false
  use-fqn: true


management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
