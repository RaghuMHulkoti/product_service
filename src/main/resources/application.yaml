# Product detail joins live offers from Supplier Service
supplier-service:
  base-url: ${SUPPLIER_SERVICE_URL:https://supplier-service-tha0.onrender.com}
  connect-timeout: 5s
  read-timeout: 60s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha
    tryItOutEnabled: true
    displayOperationId: true
  show-actuator: false
  use-fqn: true


management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
