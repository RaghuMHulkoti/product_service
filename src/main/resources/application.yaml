  connect-timeout: 5s
  read-timeout: 60s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: alpha
    tryItOutEnabled: true
    displayOperationId: true
  show-actuator: false
  use-fqn: true



management:
  otlp:
    metrics:
      export:
        enabled: true
        # Pushes the same Micrometer metrics the Prometheus endpoint serves, so Grafana Cloud needs no scraper.
        # Auth headers come from OTEL_EXPORTER_OTLP_HEADERS; only active while OTEL_METRICS_EXPORTER=otlp.
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
        base-time-unit: seconds
        resource-attributes:
          service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
    data:
      repository:
        autotime:
          enabled: true
          percentiles-histogram: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  tomcat:
    mbeanregistry:
      enabled: true

# Browser origins allowed to call this API (comma separated, e.g. the test console). Empty = none.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
