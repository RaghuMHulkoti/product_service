spring:
  application:
    name: product-service
  datasource:
    url: jdbc:oracle:thin:@ecommerce_tp?TNS_ADMIN=${WALLET_DIR:/Users/raghavendra/Downloads/Wallet_ECOMMERCE}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD:"@2ztrn322hyR"}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.OracleDialect
    show-sql: false
    properties:
      hibernate:
        default_schema: PRODUCT
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: PRODUCT
    default-schema: PRODUCT

#server:
